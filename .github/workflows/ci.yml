name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build site and regenerate CV PDF
        run: npm run generate:cv

      - name: Test
        run: npm test

      - name: Upload build output
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    # Only deploy builds from master that passed the tests
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Show deploy target
        env:
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER_DIR" ]; then
            echo "::warning::FTP_SERVER_DIR is not set, deploying to the FTP login root (./). Set it to the web root, e.g. ./public_html/"
          fi
          echo "Deploying to: ${FTP_SERVER_DIR:-./}"

      - name: Deploy to Hetzner via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: node scripts/deploy.js
